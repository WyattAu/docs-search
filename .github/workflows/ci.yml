name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@4883fca0ea86332addafaa8ba999d53ea4409ec4 # main @ 2026-11-12
    with:
      tier: b            # ≥80% line coverage; golden + property suites
      all-features: true
      loom: false        # n/a — no lock-free shared-memory primitives (recorded)
      wasm: true         # REQ-Q2: the index format builds for the browser target
      miri: false        # n/a — no unsafe blocks, no FFI

  wasm-reader-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: build cdylib (release)
        run: cargo rustc --lib --crate-type cdylib --target wasm32-unknown-unknown --release
      - name: run the wasm reader oracle
        run: cargo test --test wasm_reader --release
        env:
          DOCS_SEARCH_WASM: ${{ github.workspace }}/target/wasm32-unknown-unknown/release/docs_search.wasm
