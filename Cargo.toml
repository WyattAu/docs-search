[package]
name = "docs-search"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["Wyatt Au <wyatt_au@protonmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/docs-search"
homepage = "https://github.com/WyattAu/docs-search"
documentation = "https://docs.rs/docs-search"
description = "Client-side search index for docs sites: FST term dictionary, tf postings with full BM25, optional quantized-vector section (vectors feature), wasm32-clean bytes-in/bytes-out format (docs-core extension program, SPEC.md REQ-Q)"
readme = "README.md"
keywords = ["search", "fst", "bm25", "wasm", "documentation"]
categories = ["text-processing", "data-structures", "wasm"]
exclude = [".github/", "supply-chain/"]

# Layer model: docs/layers.md in WyattAu/engineering-standards.
# L0 - leaf: zero estate-internal dependencies. The external floor is fst
# and thiserror; the index format is plain bytes so the crate builds for
# wasm32-unknown-unknown unmodified (SPEC.md REQ-Q2).
[package.metadata.layers]
tier = "L0"

[lib]
# rlib for dependents; the cdylib shape is produced for wasm32 by
# `cargo rustc --crate-type cdylib` (the browser reader artifact).
crate-type = ["rlib"]

[features]
vectors = []

[dependencies]
fst = "0.4"
thiserror = "2"

[dev-dependencies]
proptest = "1"
# The wasm reader oracle (tests/wasm_reader.rs) loads the built cdylib
# in wasmtime and drives the C ABI exactly as the browser JS glue does.
# Host-only (dev), gated on DOCS_SEARCH_WASM in CI.
wasmtime = { version = "26", default-features = false, features = ["cranelift", "runtime", "std"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

# Content discipline (mirrors the estate's decoder pattern): a serialized
# index is untrusted input. Decoding is total: every byte-slice access is
# bounds-checked, every failure is a typed error, and no input can panic.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
