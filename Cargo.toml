[package]
name = "docs-search"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Wyatt Au <wyatt_au@protonmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/docs-search"
homepage = "https://github.com/WyattAu/docs-search"
documentation = "https://docs.rs/docs-search"
description = "Client-side search index for docs sites: FST term dictionary with roaring-bitmap postings, BM25-shaped ranking, wasm32-clean bytes-in/bytes-out format (docs-core extension program, SPEC.md REQ-Q)"
readme = "README.md"
keywords = ["search", "fst", "roaring", "wasm", "documentation"]
categories = ["text-processing", "data-structures", "wasm"]
exclude = [".github/", "supply-chain/"]

# Layer model: docs/layers.md in WyattAu/engineering-standards.
# L0 - leaf: zero estate-internal dependencies. fst + roaring are external
# leaf crates; the index format is plain bytes so the crate builds for
# wasm32-unknown-unknown unmodified (SPEC.md REQ-Q2).
[package.metadata.layers]
tier = "L0"

[dependencies]
fst = "0.4"
roaring = "0.12"
thiserror = "2"

[dev-dependencies]
proptest = "1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

# Content discipline (mirrors the estate's decoder pattern): a serialized
# index is untrusted input. Decoding is total: every byte-slice access is
# bounds-checked, every failure is a typed error, and no input can panic.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
